{% extends "layout/base.html" %}

{% block content %}

<section class="project-detail-section">

    <div class="container">

        <!-- Back Button -->

        <a href="{{ url_for('home') }}" class="back-link">

            <i class="bi bi-arrow-left"></i>

            Back to Portfolio

        </a>

        <!-- Header -->

        <div class="project-header">

            <div class="project-header-icon">

                <i class="{{ project.icon }}"></i>

            </div>

            <div>

                <span class="live-badge">

                    {{ project.status }}

                </span>

                <h1>

                    {{ project.title }}

                </h1>

                <p>

                    {{ project.description }}

                </p>

            </div>

        </div>

        <!-- Tech Stack -->

        <div class="project-section">

            <h3>

                Technology Stack

            </h3>

            <div class="project-tech">

                {% for tag in project.tags %}

                    <span>

                        {{ tag }}

                    </span>

                {% endfor %}

            </div>

        </div>

        <!-- Highlight -->

        <div class="project-section">

            <h3>

                Project Highlight

            </h3>

            <p>

                {{ project.featured }}

            </p>

        </div>

        <!-- Buttons -->

        <div class="project-links">

            <a href="{{ project.github }}"
               target="_blank"
               class="btn btn-ai">

                <i class="bi bi-github"></i>

                GitHub

            </a>

            <a href="{{ project.live }}"
               target="_blank"
               class="btn btn-outline-ai">

                Live Demo

            </a>

        </div>

    </div>

</section>

{% endblock %}
