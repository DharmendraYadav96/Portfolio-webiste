{%extends 'base.html' %}
{% block content %}
<style>
    body {
        background-color: #f4f4f4;
    }
    .contact-info {
        background-color: #35495e;
        color: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
    }
    .contact-form {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    footer {
        text-align: center;
        padding: 20px;
        background: #35495e;
        color: white;
        margin-top: 20px;
    }
</style>
<div class="container mt-5">
    <h1 class="text-center mb-4">Contact Me</h1>

    <!-- Contact Information -->
    <div class="contact-info">
        <h4>Get in Touch</h4>
        <p><strong>Mobile:</strong> +91 8169504103</p>
        <p><strong>Email:</strong> dharmydv96@gmail.com</p>
        <p><strong>LinkedIn:</strong> <a href="http://linkedin.com/in/dharmendrayadav1996" class="text-light" target="_blank">linkedin.com/in/dharmendrayadav1996</a></p>
        <p><strong>GitHub:</strong> <a href="https://github.com/DharmendraYadav96" class="text-light" target="_blank">github.com/DharmendraYadav96</a></p>
    </div>

    <!-- Contact Form -->
    <div class="contact-form">
        <h4>Send a Message</h4>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Your Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Your Message</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</div>
{%endblock%}
